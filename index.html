/* =====================
顶部栏
===================== */


.header{

    height:75px;

.status{

/* =====================

===================== */


.nav{

    gap:25px;

}



.nav button{

    height:55px;


    background:#10384b;


    border:1px solid #38d4ff;


    color:white;


    font-size:17px;

    cursor:pointer;


    transition:.3s;


}




.nav button:hover{


    background:#176985;

}






/* =====================
主内容区域
===================== */


.container{


    width:85%;


    height:560px;


    overflow-y:auto;


    margin:20px auto;

    rgba(5,20,30,.9);

.info{

}






/* =====================

===================== */


.hidden-link{

/* =====================

.location-active{

===================== */

/* =====================

===================== */

/* =====================
监控录像窗口
===================== */


.camera-box{

    background:#020609;


    border:1px solid #3bc7e8;


    padding:25px;


    border-radius:12px;


}





.camera-screen{


    height:280px;


    position:relative;


    overflow:hidden;


    background:#020506;


    display:flex;


    justify-content:center;


    align-items:center;


    text-align:center;


    color:#5be0ff;


    font-size:24px;


    letter-spacing:3px;


}





/* 扫描线 */


.camera-screen::after{


    content:"";


    position:absolute;


    width:100%;


    height:100%;



    background:


    repeating-linear-gradient(

    0deg,

    rgba(255,255,255,.05),

    rgba(255,255,255,.05) 2px,

    transparent 3px,

    transparent 5px

    );



    animation:scan 2s linear infinite;


}




@keyframes scan{


from{


    transform:translateY(-30px);


}


to{


    transform:translateY(30px);


}


}





/* 雪花噪点 */


.noise{


    position:absolute;


    width:100%;


    height:100%;


    background-image:


    radial-gradient(

    white 1px,

    transparent 1px

    );



    background-size:5px 5px;


    opacity:.12;


    animation:noiseMove .15s infinite;


}




@keyframes noiseMove{


0%{

transform:translate(0,0);

}


25%{

transform:translate(-10px,5px);

}


50%{

transform:translate(5px,-10px);

}


75%{

transform:translate(10px,5px);

}


100%{

transform:translate(0,0);

}


}






.camera-info{


    margin-top:20px;


    line-height:2;


    color:#b7d8e5;


}




.video-time{

.timeline{

    border-radius:10px;


}




.progress{

.controls{

.controls button{

// ===============================

// ===============================
// 播放
// ===============================


function videoPlay(){



if(timer){

return;

}



timer=setInterval(function(){



currentSeconds+=speed;



let max=parseTime(currentVideo.length);



if(currentSeconds>=max){


currentSeconds=max;


clearInterval(timer);


timer=null;


}




updateClock(max);



},1000);



}








// ===============================
// 暂停
// ===============================


function videoPause(){


clearInterval(timer);


timer=null;


}








// ===============================
// 快进
// ===============================


function videoFast(){


speed=2;


}








// ===============================
// 时间转换
// ===============================


function parseTime(t){


let arr=t.split(":");


return Number(arr[0])*3600+

Number(arr[1])*60+

Number(arr[2]);


}








// ===============================
// 更新时间
// ===============================


function updateClock(max){



let h=Math.floor(currentSeconds/3600);


let m=Math.floor(

(currentSeconds%3600)/60

);



let s=currentSeconds%60;




h=String(h).padStart(2,"0");


m=String(m).padStart(2,"0");


s=String(s).padStart(2,"0");




let clock=document.getElementById("clock");


let bar=document.getElementById("bar");



if(clock){


clock.innerHTML=

`${h}:${m}:${s} / ${currentVideo.length}`;


}



if(bar){


bar.style.width=

(currentSeconds/max*100)+"%";


}



}
