<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>黄杰的手机</title>

<style>

/* =====================================================
   全局
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    background: #202124;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =====================================================
   手机
===================================================== */

.phone {

    width: 390px;

    height: 800px;

    background: #050505;

    border-radius: 43px;

    padding: 10px;

    position: relative;

    box-shadow:
        0 0 0 2px #555,
        0 30px 80px rgba(0,0,0,0.7);
}


.screen {

    width: 100%;

    height: 100%;

    border-radius: 34px;

    overflow: hidden;

    position: relative;

    background: #111;
}


/* =====================================================
   刘海
===================================================== */

.notch {

    position: absolute;

    width: 125px;

    height: 28px;

    background: #000;

    top: 0;

    left: 50%;

    transform: translateX(-50%);

    border-radius:
        0 0 18px 18px;

    z-index: 2000;
}


/* =====================================================
   手机桌面
===================================================== */

.home-screen {

    position: absolute;

    inset: 0;

    color: white;

    background:
        linear-gradient(
            135deg,
            #69757d,
            #39444b 50%,
            #20282d
        );

    display: flex;

    flex-direction: column;

    opacity: 1;

    z-index: 100;
}


/* =====================================================
   状态栏
===================================================== */

.status-bar {

    height: 42px;

    padding:
        0 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-size: 13px;
}


.status-right {

    display: flex;

    gap: 8px;

    align-items: center;
}


.battery {

    width: 23px;

    height: 11px;

    border:
        1px solid white;

    border-radius: 3px;

    position: relative;
}


.battery::after {

    content: "";

    position: absolute;

    right: -4px;

    top: 2px;

    width: 2px;

    height: 5px;

    background: white;
}


.battery-level {

    position: absolute;

    left: 1px;

    top: 1px;

    width: 17px;

    height: 7px;

    background: white;

    border-radius: 1px;
}


/* =====================================================
   桌面 App
===================================================== */

.apps {

    padding:
        35px 25px;

    display: flex;

    flex-wrap: wrap;

    gap: 20px;
}


.app {

    width: 65px;

    text-align: center;

    cursor: pointer;

    user-select: none;
}


.app-icon {

    width: 58px;

    height: 58px;

    margin: auto;

    margin-bottom: 7px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #fafafa,
            #cfcfcf
        );

    color: #444;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    box-shadow:
        0 5px 12px rgba(0,0,0,0.35);

    transition:
        transform 0.12s ease;
}


.app:active .app-icon {

    transform:
        scale(0.9);
}


.app-name {

    font-size: 12px;

    color: white;

    text-shadow:
        0 1px 3px #000;
}


/* =====================================================
   相册 App
===================================================== */

.gallery-app {

    position: absolute;

    inset: 0;

    background: #f5f5f5;

    color: #111;

    z-index: 500;

    opacity: 0;

    pointer-events: none;

    transform: scale(0.96);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}


.gallery-app.open {

    opacity: 1;

    pointer-events: auto;

    transform: scale(1);
}


/* =====================================================
   相册顶部
===================================================== */

.gallery-header {

    height: 58px;

    background: rgba(255,255,255,0.97);

    border-bottom:
        1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    z-index: 20;
}


.gallery-title {

    font-size: 18px;

    font-weight: 600;
}


.gallery-back {

    position: absolute;

    left: 16px;

    font-size: 30px;

    cursor: pointer;

    color: #333;

    width: 40px;

    height: 40px;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =====================================================
   相册内容
===================================================== */

.gallery-content {

    position: absolute;

    top: 58px;

    bottom: 65px;

    left: 0;

    right: 0;

    overflow-y: auto;

    background: #f5f5f5;

    padding: 15px;
}


/* =====================================================
   相册分类
===================================================== */

.album-section {

    margin-bottom: 25px;
}


.album-section-title {

    font-size: 15px;

    font-weight: 600;

    margin-bottom: 12px;
}


.album-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 4px;
}


.photo-placeholder {

    aspect-ratio: 1 / 1;

    background:
        linear-gradient(
            135deg,
            #dadada,
            #bcbcbc
        );

    display: flex;

    align-items: center;

    justify-content: center;

    color: #888;

    font-size: 12px;

    overflow: hidden;
}


/* =====================================================
   隐藏相册
===================================================== */

.hidden-album {

    background: white;

    border-radius: 12px;

    padding: 17px;

    display: flex;

    align-items: center;

    cursor: pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    transition:
        background 0.15s ease;
}


.hidden-album:active {

    background: #eeeeee;
}


.hidden-album-icon {

    width: 54px;

    height: 54px;

    border-radius: 12px;

    background:
        #303030;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    margin-right: 13px;
}


.hidden-album-info {

    flex: 1;
}


.hidden-album-name {

    font-size: 16px;

    font-weight: 600;

    margin-bottom: 5px;
}


.hidden-album-description {

    font-size: 12px;

    color: #999;
}


.hidden-album-arrow {

    font-size: 23px;

    color: #aaa;
}


/* =====================================================
   相册底部
===================================================== */

.gallery-bottom {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 65px;

    background:
        rgba(255,255,255,0.98);

    border-top:
        1px solid #ddd;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #555;

    font-size: 12px;
}


/* =====================================================
   密码界面
===================================================== */

.password-page {

    position: absolute;

    inset: 0;

    background:
        rgba(245,245,245,0.98);

    z-index: 1000;

    display: none;

    flex-direction: column;

    align-items: center;

    padding-top: 105px;
}


.password-page.show {

    display: flex;
}


.password-lock {

    width: 65px;

    height: 65px;

    border-radius: 50%;

    background: #333;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    margin-bottom: 18px;
}


.password-title {

    font-size: 21px;

    font-weight: 600;

    margin-bottom: 8px;
}


.password-hint {

    color: #777;

    font-size: 13px;

    margin-bottom: 22px;
}


.password-input {

    width: 255px;

    height: 48px;

    border:
        1px solid #ccc;

    border-radius: 8px;

    background: white;

    font-size: 20px;

    letter-spacing: 7px;

    text-align: center;

    outline: none;

    margin-bottom: 10px;
}


.password-error {

    height: 22px;

    color: #d33;

    font-size: 13px;

    margin-bottom: 12px;
}


.password-buttons {

    display: flex;

    gap: 12px;
}


.password-button {

    border: none;

    border-radius: 8px;

    padding:
        10px 25px;

    font-size: 14px;

    cursor: pointer;

    background: #ddd;
}


.password-button.confirm {

    background: #333;

    color: white;
}


/* =====================================================
   隐藏视频页面
===================================================== */

.secret-video-page {

    position: absolute;

    inset: 0;

    background: #101010;

    color: white;

    z-index: 1200;

    display: none;

    flex-direction: column;
}


.secret-video-page.show {

    display: flex;
}


/* =====================================================
   视频顶部
===================================================== */

.secret-video-header {

    height: 58px;

    display: flex;

    align-items: center;

    border-bottom:
        1px solid #333;

    position: relative;
}


.secret-video-back {

    width: 55px;

    height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

    cursor: pointer;
}


.secret-video-title {

    font-size: 17px;

    font-weight: 600;
}


/* =====================================================
   视频区域
===================================================== */

.video-area {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 18px;
}


.video-placeholder {

    width: 100%;

    height: 390px;

    background:
        linear-gradient(
            135deg,
            #272727,
            #111
        );

    border:
        1px solid #444;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    overflow: hidden;
}


.video-play-icon {

    width: 68px;

    height: 68px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.13);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 29px;

    color: #eee;

    margin-bottom: 150px;
}


.video-label {

    position: absolute;

    bottom: 18px;

    left: 18px;

    right: 18px;

    text-align: center;

    color: #aaa;

    font-size: 12px;

}


/* =====================================================
   视频文字描述
===================================================== */

.video-description {

    background:
        #191919;

    border-top:
        1px solid #333;

    padding:
        17px 18px 22px;

    max-height: 245px;

    overflow-y: auto;
}


.video-description-title {

    color: #aaa;

    font-size: 12px;

    margin-bottom: 10px;
}


.video-description-text {

    font-size: 14px;

    line-height: 1.75;

    color: #e5e5e5;

    white-space: pre-line;
}


.important-text {

    color: #fff;

    font-weight: 600;
}


/* =====================================================
   Home 键
===================================================== */

.home-button {

    position: absolute;

    width: 140px;

    height: 25px;

    left: 50%;

    bottom: 0;

    transform:
        translateX(-50%);

    z-index: 1900;

    cursor: pointer;
}


.home-button::after {

    content: "";

    position: absolute;

    width: 120px;

    height: 4px;

    left: 10px;

    bottom: 7px;

    background: #111;

    border-radius: 5px;

    opacity: 0.8;
}


.home-button:active::after {

    width: 100px;

    left: 20px;

    opacity: 0.55;
}


/* =====================================================
   小屏适配
===================================================== */

@media (max-height: 850px) {

    .phone {

        transform: scale(0.9);

    }

}


@media (max-height: 720px) {

    .phone {

        transform: scale(0.78);

    }

}

</style>

</head>


<body>


<div class="phone">

<div class="screen">


<!-- =====================================================
     手机刘海
===================================================== -->

<div class="notch"></div>


<!-- =====================================================
     手机桌面
===================================================== -->

<div
    class="home-screen"
    id="homeScreen"
>


    <!-- 状态栏 -->

    <div class="status-bar">


        <div id="phoneTime">
            20:16
        </div>


        <div class="status-right">

            <span>▮▮▮</span>

            <span>⌁</span>

            <div class="battery">

                <div class="battery-level"></div>

            </div>

        </div>


    </div>


    <!-- App -->

    <div class="apps">


        <div
            class="app"
            onclick="openGallery()"
        >

            <div class="app-icon">
                ▣
            </div>

            <div class="app-name">
                相册
            </div>

        </div>


    </div>


</div>


<!-- =====================================================
     相册
===================================================== -->

<div
    class="gallery-app"
    id="galleryApp"
>


    <div class="gallery-header">


        <div
            class="gallery-back"
            onclick="closeGallery()"
        >
            ‹
        </div>


        <div class="gallery-title">
            相册
        </div>


    </div>


    <div class="gallery-content">


        <!-- 普通照片 -->

        <div class="album-section">


            <div class="album-section-title">
                最近项目
            </div>


            <div class="album-grid">


                <div class="photo-placeholder">
                    照片
                </div>

                <div class="photo-placeholder">
                    照片
                </div>

                <div class="photo-placeholder">
                    照片
                </div>

                <div class="photo-placeholder">
                    照片
                </div>

                <div class="photo-placeholder">
                    照片
                </div>

                <div class="photo-placeholder">
                    照片
                </div>


            </div>


        </div>


        <!-- 隐藏相册 -->

        <div class="album-section">


            <div class="album-section-title">
                其他
            </div>


            <div
                class="hidden-album"
                onclick="openPassword()"
            >


                <div class="hidden-album-icon">
                    🔒
                </div>


                <div class="hidden-album-info">


                    <div class="hidden-album-name">
                        隐藏相册
                    </div>


                    <div class="hidden-album-description">
                        已隐藏的项目
                    </div>


                </div>


                <div class="hidden-album-arrow">
                    ›
                </div>


            </div>


        </div>


    </div>


    <div class="gallery-bottom">
        相册
    </div>


</div>


<!-- =====================================================
     隐藏相册密码
===================================================== -->

<div
    class="password-page"
    id="passwordPage"
>


    <div class="password-lock">
        🔒
    </div>


    <div class="password-title">
        隐藏相册
    </div>


    <div class="password-hint">
        密码提示：鉴定之日
    </div>


    <input
        class="password-input"
        id="passwordInput"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="输入密码"
    >


    <div
        class="password-error"
        id="passwordError"
    ></div>


    <div class="password-buttons">


        <button
            class="password-button"
            onclick="closePassword()"
        >
            取消
        </button>


        <button
            class="password-button confirm"
            onclick="checkSecretPassword()"
        >
            确定
        </button>


    </div>


</div>


<!-- =====================================================
     隐藏视频
===================================================== -->

<div
    class="secret-video-page"
    id="secretVideoPage"
>


    <div class="secret-video-header">


        <div
            class="secret-video-back"
            onclick="closeSecretVideo()"
        >
            ‹
        </div>


        <div class="secret-video-title">
            隐藏视频
        </div>


    </div>


    <div class="video-area">


        <div class="video-placeholder">


            <div class="video-play-icon">
                ▶
            </div>


            <div class="video-label">
                视频内容以文字形式保存
            </div>


        </div>


    </div>


    <div class="video-description">


        <div class="video-description-title">
            视频内容描述
        </div>


        <div class="video-description-text">

视频为第一视角。

画面中，一个男人正在医院准备室中。

男人自言自语：

“亲爱的，我刚刚做鉴定了，至少我保证了孩子是我们的。”

随后男人说话戛然而止。

他低头看向手中的试管。

试管上写着：

<span class="important-text">“余沐”</span>

标签有一个角翘起，仿佛是重新粘贴过。

随后，主视角看向地面。

男人弯腰捡起地上的一张被撕下来的标签。

标签上写着：

<span class="important-text">“余明辉~”</span>

视频戛然而止。

        </div>


    </div>


</div>


<!-- =====================================================
     Home 键
===================================================== -->

<div
    class="home-button"
    onclick="goHome()"
    title="返回桌面"
></div>


</div>

</div>


<script>

/* =====================================================
   手机时间
===================================================== */

function updateTime() {

    const now =
        new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );

    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );

    document
        .getElementById(
            "phoneTime"
        )
        .textContent =
        hours + ":" + minutes;

}


updateTime();

setInterval(
    updateTime,
    1000
);


/* =====================================================
   打开相册
===================================================== */

function openGallery() {

    document
        .getElementById(
            "galleryApp"
        )
        .classList
        .add(
            "open"
        );

}


/* =====================================================
   关闭相册
===================================================== */

function closeGallery() {

    document
        .getElementById(
            "galleryApp"
        )
        .classList
        .remove(
            "open"
        );

}


/* =====================================================
   打开隐藏相册密码
===================================================== */

function openPassword() {

    document
        .getElementById(
            "passwordPage"
        )
        .classList
        .add(
            "show"
        );


    document
        .getElementById(
            "passwordInput"
        )
        .value =
        "";


    document
        .getElementById(
            "passwordError"
        )
        .textContent =
        "";


    setTimeout(
        function() {

            document
                .getElementById(
                    "passwordInput"
                )
                .focus();

        },
        100
    );

}


/* =====================================================
   关闭密码
===================================================== */

function closePassword() {

    document
        .getElementById(
            "passwordPage"
        )
        .classList
        .remove(
            "show"
        );

}


/* =====================================================
   检查隐藏相册密码
===================================================== */

function checkSecretPassword() {

    const input =
        document
            .getElementById(
                "passwordInput"
            );


    const error =
        document
            .getElementById(
                "passwordError"
            );


    if (
        input.value ===
        "20260825"
    ) {

        error.textContent =
            "";


        document
            .getElementById(
                "passwordPage"
            )
            .classList
            .remove(
                "show"
            );


        document
            .getElementById(
                "secretVideoPage"
            )
            .classList
            .add(
                "show"
            );


    } else {

        error.textContent =
            "密码错误";

        input.value = "";

        input.animate(
            [
                {
                    transform:
                        "translateX(0)"
                },

                {
                    transform:
                        "translateX(-7px)"
                },

                {
                    transform:
                        "translateX(7px)"
                },

                {
                    transform:
                        "translateX(0)"
                }
            ],
            {
                duration: 250
            }
        );

    }

}


/* =====================================================
   Enter 键确认密码
===================================================== */

document
    .getElementById(
        "passwordInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                checkSecretPassword();

            }

        }
    );


/* =====================================================
   关闭隐藏视频
===================================================== */

function closeSecretVideo() {

    document
        .getElementById(
            "secretVideoPage"
        )
        .classList
        .remove(
            "show"
        );

}


/* =====================================================
   Home 键
===================================================== */

function goHome() {

    /*
       关闭隐藏视频
    */

    document
        .getElementById(
            "secretVideoPage"
        )
        .classList
        .remove(
            "show"
        );


    /*
       关闭密码页面
    */

    document
        .getElementById(
            "passwordPage"
        )
        .classList
        .remove(
            "show"
        );


    /*
       关闭相册
    */

    document
        .getElementById(
            "galleryApp"
        )
        .classList
        .remove(
            "open"
        );

}

</script>


</body>

</html>
