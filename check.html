<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>匹配出轨对象</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #08090c;
        --panel: rgba(18, 19, 24, 0.92);
        --panel-light: #17191f;
        --border: rgba(255,255,255,.09);
        --text: #f0f0f2;
        --muted: #747780;
        --accent: #a42d43;
        --accent-light: #d34a63;
        --success: #55c68b;
        --warning: #d8ae5a;
        --error: #d95c68;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at 50% 20%, rgba(133,32,53,.13), transparent 35%),
            radial-gradient(circle at 15% 80%, rgba(60,45,80,.09), transparent 30%),
            #08090c;
        color: var(--text);
        font-family:
            "PingFang SC",
            "Microsoft YaHei",
            system-ui,
            -apple-system,
            sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    /* 背景网格 */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
    }

    .wrapper {
        width: min(92%, 720px);
        position: relative;
        z-index: 2;
    }

    .top-label {
        text-align: center;
        color: #666a73;
        letter-spacing: 5px;
        font-size: 11px;
        margin-bottom: 16px;
    }

    .container {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 46px 48px 42px;
        box-shadow:
            0 30px 80px rgba(0,0,0,.55),
            inset 0 1px 0 rgba(255,255,255,.025);
        backdrop-filter: blur(20px);
        position: relative;
        overflow: hidden;
    }

    .container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(211,74,99,.7),
            transparent
        );
    }

    .number {
        font-family: monospace;
        color: #4b4d55;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 24px;
    }

    h1 {
        font-size: 35px;
        font-weight: 500;
        letter-spacing: 4px;
        margin-bottom: 10px;
    }

    .english-title {
        font-family: Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 4px;
        color: #5c5f68;
        margin-bottom: 38px;
    }

    .divider {
        width: 100%;
        height: 1px;
        background: var(--border);
        margin-bottom: 32px;
    }

    .label {
        display: block;
        color: #888b93;
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }

    select,
    input {
        width: 100%;
        height: 54px;
        background: #101116;
        border: 1px solid #292b32;
        color: #e8e8eb;
        border-radius: 10px;
        padding: 0 17px;
        outline: none;
        font-size: 15px;
        transition: .25s;
    }

    select {
        cursor: pointer;
    }

    select:focus,
    input:focus {
        border-color: rgba(211,74,99,.7);
        box-shadow: 0 0 0 3px rgba(164,45,67,.08);
    }

    select option {
        background: #121318;
    }

    .input-section {
        margin-top: 27px;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        max-height: 0;
        overflow: hidden;
        transition:
            opacity .35s,
            transform .35s,
            max-height .45s;
    }

    .input-section.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
        max-height: 400px;
    }

    .selected-person {
        font-size: 11px;
        color: #696c75;
        margin-bottom: 11px;
        letter-spacing: 1px;
    }

    .selected-person span {
        color: #c44b61;
    }

    input::placeholder {
        color: #4d5058;
    }

    .check-button {
        margin-top: 16px;
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 10px;
        cursor: pointer;

        background:
            linear-gradient(
                135deg,
                #87283b,
                #a73349
            );

        color: white;
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 4px;

        transition: .25s;
        position: relative;
        overflow: hidden;
    }

    .check-button:hover {
        transform: translateY(-1px);
        background:
            linear-gradient(
                135deg,
                #9d3046,
                #bd3e57
            );
        box-shadow: 0 8px 25px rgba(164,45,67,.2);
    }

    .check-button:active {
        transform: translateY(1px);
    }

    /* 结果区域 */
    .result {
        margin-top: 22px;
        border-radius: 10px;
        padding: 0 18px;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: .35s;
        border: 1px solid transparent;
    }

    .result.show {
        padding: 18px;
        max-height: 180px;
        opacity: 1;
    }

    .result-title {
        font-size: 16px;
        letter-spacing: 2px;
        margin-bottom: 7px;
    }

    .result-desc {
        font-size: 12px;
        line-height: 1.8;
        color: #8e9199;
    }

    .result.success {
        background: rgba(52,145,98,.07);
        border-color: rgba(85,198,139,.22);
    }

    .result.success .result-title {
        color: var(--success);
    }

    .result.error {
        background: rgba(180,55,70,.07);
        border-color: rgba(217,92,104,.2);
    }

    .result.error .result-title {
        color: var(--error);
    }

    .result.close {
        background: rgba(185,137,52,.07);
        border-color: rgba(216,174,90,.22);
    }

    .result.close .result-title {
        color: var(--warning);
    }

    .answer {
        margin-top: 8px;
        color: #d6b26a;
        font-size: 13px;
    }

    .footer {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #41434a;
        font-family: monospace;
        font-size: 9px;
        letter-spacing: 1px;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #7d2637;
        box-shadow: 0 0 8px rgba(164,45,67,.7);
    }

    /* 失败时轻微震动 */
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-5px); }
        40% { transform: translateX(5px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
    }

    .shake {
        animation: shake .35s ease;
    }

    @media (max-width: 600px) {
        .container {
            padding: 35px 25px 32px;
        }

        h1 {
            font-size: 28px;
        }
    }
</style>
</head>

<body>

<div class="wrapper">

    <div class="top-label">
        RELATIONSHIP DATABASE
    </div>

    <main class="container" id="mainPanel">

        <div class="number">
            CASE FILE / 06
        </div>

        <h1>匹配出轨对象</h1>

        <div class="english-title">
            MATCH THE SECRET LOVER
        </div>

        <div class="divider"></div>

        <!-- 角色选择 -->
        <label class="label">
            SELECT CHARACTER / 选择角色
        </label>

        <select id="characterSelect">
            <option value="">— 请选择角色 —</option>
            <option value="宇文若">宇文若</option>
            <option value="艾仙儿">艾仙儿</option>
            <option value="颜悦洋">颜悦洋</option>
            <option value="吕牧原">吕牧原</option>
            <option value="谢孟迪">谢孟迪</option>
            <option value="叶倩倩">叶倩倩</option>
        </select>

        <!-- 输入区域 -->
        <div class="input-section" id="inputSection">

            <div class="selected-person">
                CURRENT TARGET /
                <span id="currentCharacter"></span>
            </div>

            <input
                type="text"
                id="answerInput"
                placeholder="输入该角色的出轨对象"
                autocomplete="off"
            >

            <button
                class="check-button"
                id="checkButton"
            >
                CHECK
            </button>

            <!-- 判断结果 -->
            <div class="result" id="resultBox">
                <div
                    class="result-title"
                    id="resultTitle"
                ></div>

                <div
                    class="result-desc"
                    id="resultDesc"
                ></div>
            </div>

        </div>

        <div class="footer">
            <div class="status">
                <span class="dot"></span>
                DATABASE ONLINE
            </div>

            <div>
                CONFIDENTIAL
            </div>
        </div>

    </main>

</div>

<script>

const characterSelect = document.getElementById("characterSelect");
const inputSection = document.getElementById("inputSection");
const currentCharacter = document.getElementById("currentCharacter");
const answerInput = document.getElementById("answerInput");
const checkButton = document.getElementById("checkButton");

const resultBox = document.getElementById("resultBox");
const resultTitle = document.getElementById("resultTitle");
const resultDesc = document.getElementById("resultDesc");

const mainPanel = document.getElementById("mainPanel");


/* ================================
   正确答案数据库
================================ */

const answers = {

    "宇文若": [
        "错别字"
    ],

    "艾仙儿": [
        "秦始皇",
        "嬴政"
    ],

    "颜悦洋": [
        "作者",
        "TOBE，卧珑",
        "TOBE和卧珑"
    ],

    "吕牧原": [
        "小女孩"
    ],

    "谢孟迪": [
        "DM",
        "主持人"
    ],

    "叶倩倩": [
        "月亮"
    ]

};


/* ================================
   选择角色
================================ */

characterSelect.addEventListener("change", function() {

    const character = this.value;

    // 清空之前的状态
    answerInput.value = "";
    hideResult();

    if (character) {

        currentCharacter.textContent = character;

        inputSection.classList.add("show");

        setTimeout(() => {
            answerInput.focus();
        }, 300);

    } else {

        inputSection.classList.remove("show");

    }

});


/* ================================
   CHECK
================================ */

checkButton.addEventListener("click", checkAnswer);


/* 按 Enter 也可以检查 */
answerInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        checkAnswer();
    }

});


function checkAnswer() {

    const character = characterSelect.value;

    // trim 只去除输入前后的空格，
    // 不会改变中间文字，因此仍然要求答案完全匹配。
    const input = answerInput.value.trim();

    if (!character) {
        return;
    }

    if (!input) {

        showError(
            "MATCH FAILED",
            "请输入该角色的出轨对象。"
        );

        return;
    }


    /* ================================
       颜悦洋特殊判断
    ================================ */

    if (character === "颜悦洋") {

        if (input === "TOBE" || input === "卧珑") {

            showClose();

            return;
        }

    }


    /* ================================
       普通正确答案判断
    ================================ */

    if (answers[character].includes(input)) {

        showSuccess(character);

    } else {

        showError(
            "MATCH FAILED",
            "匹配失败。该答案与数据库记录不符。"
        );

    }

}


/* ================================
   成功
================================ */

function showSuccess(character) {

    resultBox.className = "result success show";

    resultTitle.textContent = "✓ 匹配成功";

    resultDesc.innerHTML =
        "身份关系已确认。<br>" +
        "<span style='color:#555861'>DATABASE MATCH CONFIRMED</span>";

}


/* ================================
   失败
================================ */

function showError(title, description) {

    resultBox.className = "result error show";

    resultTitle.textContent = "× " + title;

    resultDesc.textContent = description;


    /* 面板震动 */
    mainPanel.classList.remove("shake");

    void mainPanel.offsetWidth;

    mainPanel.classList.add("shake");

}


/* ================================
   颜悦洋 —— 十分接近
================================ */

function showClose() {

    resultBox.className = "result close show";

    resultTitle.textContent = "△ 十分接近";

    resultDesc.innerHTML = `
        你已经找到了其中一位，但答案并不完整。
        
        <div class="answer">
            正确答案：TOBE，卧珑
        </div>
    `;

}


/* ================================
   隐藏结果
================================ */

function hideResult() {

    resultBox.className = "result";

    resultTitle.textContent = "";

    resultDesc.innerHTML = "";

}

</script>

</body>
</html>
